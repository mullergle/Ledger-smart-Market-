<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signing you in…</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: #0f0f12;
            --primary-bright: #f0b90b;
            --primary-glow: rgba(240,185,11,0.35);
            --primary-teal: #1ebba3;
            --primary-red: #f23645;
            --text-white: #ffffff;
            --text-gray: #9b9ba3;
            --border-color: #2a2a2e;
            --input-bg: #141418;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0;
            background: #050505 !important;
            width: 100%; max-width: 100vw; overflow-x: hidden;
            overscroll-behavior-y: none;
        }
        body {
            background: linear-gradient(180deg, #131315 0%, #070708 45%, #030303 100%) fixed;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        /* ================= SPINNER ================= */
        .spinner-wrap {
            position: relative;
            width: 56px; height: 56px;
            margin-bottom: 28px;
            display: flex; align-items: center; justify-content: center;
        }
        .ios-spinner {
            position: relative;
            width: 48px; height: 48px;
            animation: iosSpinDecay 1.2s cubic-bezier(0.45, 0.05, 0.15, 1) infinite;
        }
        .ios-spinner .dot {
            position: absolute;
            width: 12px; height: 12px;
            border-radius: 50%;
            background-color: var(--primary-bright);
            box-shadow: 0 0 12px rgba(240,185,11,0.5);
        }
        .ios-spinner .dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
        .ios-spinner .dot:nth-child(2) { bottom: 6px; right: 4px; }
        .ios-spinner .dot:nth-child(3) { bottom: 6px; left: 4px; }
        @keyframes iosSpinDecay { 0% { transform: rotate(0deg); } 100% { transform: rotate(1080deg); } }

        /* ================= TEXT ================= */
        h2#status {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.2px;
        }
        p#sub-status {
            font-size: 14px;
            color: var(--text-gray);
            max-width: 340px;
            line-height: 1.5;
        }

        /* ================= ERROR BOX ================= */
        #error-box {
            background: rgba(242, 54, 69, 0.08);
            border: 1px solid rgba(242, 54, 69, 0.5);
            border-left: 3px solid var(--primary-red);
            padding: 18px 20px;
            border-radius: 12px;
            display: none;
            max-width: 400px;
            width: 100%;
            text-align: left;
            margin-top: 28px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            animation: fadeIn 0.35s ease;
        }
        #error-box b {
            color: var(--primary-red);
            font-size: 14px;
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }
        #error-box span {
            color: #e6e6e6;
            font-size: 13px;
            line-height: 1.55;
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Success state — tint the spinner dots teal */
        body.success .ios-spinner .dot {
            background-color: var(--primary-teal);
            box-shadow: 0 0 12px rgba(30,187,163,0.5);
        }
        body.success .ios-spinner {
            animation: none;
            transform: rotate(0deg);
        }
        body.success #status { color: var(--primary-teal); }
    </style>
</head>
<body>

    <div class="spinner-wrap">
        <div class="ios-spinner" id="spinner">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <h2 id="status">Authenticating…</h2>
    <p id="sub-status">Please wait while we verify your secure session.</p>

    <div id="error-box">
        <b>Authentication Error</b>
        <span id="error-text"></span>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabase = createClient(
            'https://pjxhrnivrhnnnbpnduwh.supabase.co',
            'sb_publishable_8yA4Ly2r0P2LfP17Nl-Omg_5q3pfkhN'
        );

        const API_BASE_URL = 'https://apexline-market.onrender.com';

        const spinner     = document.getElementById('spinner');
        const statusEl    = document.getElementById('status');
        const subStatusEl = document.getElementById('sub-status');
        const errorBox    = document.getElementById('error-box');
        const errorText   = document.getElementById('error-text');

        (async () => {
            // 1. Give Supabase a moment to parse the URL hash
            await new Promise(r => setTimeout(r, 1000));

            // 2. Read the session
            const { data, error } = await supabase.auth.getSession();

            if (error || !data?.session) {
                spinner.style.display = 'none';
                statusEl.innerText = 'Login Failed';
                subStatusEl.innerText = 'Could not retrieve session. Redirecting back…';
                setTimeout(() => window.location.replace('index.html'), 2500);
                return;
            }

            const user     = data.session.user;
            const email    = user.email;
            const fullName = user.user_metadata?.full_name
                          || user.user_metadata?.name
                          || email.split('@')[0];

            // 3. Sync with backend
            statusEl.innerText    = 'Syncing Account…';
            subStatusEl.innerText = 'Connecting to secure database.';

            try {
                const res = await fetch(`${API_BASE_URL}/login/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        fullName,
                        supabase_id: user.id
                    })
                });

                const out = await res.json();
                console.log('Backend response:', out);

                if (!res.ok || out.success === false) {
                    throw new Error(out.message || 'Database sync failed.');
                }
            } catch (e) {
                console.warn('Backend connection failed:', e);
                spinner.style.display = 'none';
                statusEl.innerText    = 'Connection Error';
                subStatusEl.innerText = 'Failed to reach the server.';
                errorBox.style.display = 'block';
                errorText.innerHTML = `${e.message || 'Unknown error'}<br><br>Please check that the Render server is awake and try again.`;
                return;
            }

            // 4. Persist session locally
            statusEl.innerText    = 'Success!';
            subStatusEl.innerText = 'Redirecting to your dashboard…';
            document.body.classList.add('success');

            localStorage.setItem('nexoraUser', JSON.stringify({
                id: user.id,
                email,
                full_name: fullName,
                provider: 'google',
                supabase_id: user.id
            }));
            localStorage.setItem('nexoraToken', data.session.access_token);
            localStorage.setItem('nexoraLastSeen', String(Date.now()));
            localStorage.setItem('nexoraJoinedAt', String(Date.now()));

            setTimeout(() => window.location.replace('dashboard.html'), 600);
        })();
    </script>
</body>
</html>

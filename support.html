<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Apex Trade Market | Support</title>

    <script>
    (function () {
      const IDLE_TIMEOUT_MS   = 30 * 60 * 1000;
      const LOGIN_PAGE        = 'index.html';
      const LAST_SEEN_KEY     = 'nexoraLastSeen';
      const WRITE_THROTTLE_MS = 30_000;

      const currentPage = location.pathname.split('/').pop() || 'index.html';
      const isLoginPage = currentPage === LOGIN_PAGE;

      const AUTH_KEYS    = ['nexoraUser', 'nexoraToken', 'nexoraJoinedAt', 'nexoraLastSeen'];
      const SESSION_KEYS = ['popupShown', 'nexoraState'];

      const clearAuth = () => {
        AUTH_KEYS.forEach(k => localStorage.removeItem(k));
        SESSION_KEYS.forEach(k => sessionStorage.removeItem(k));
      };

      const logout = () => {
        clearAuth();
        if (!isLoginPage) location.replace(LOGIN_PAGE);
      };

      const isExpired = (t) => t > 0 && (Date.now() - t) > IDLE_TIMEOUT_MS;

      if (!isLoginPage && !localStorage.getItem('nexoraUser')) {
        location.replace(LOGIN_PAGE);
        return;
      }

      const lastSeen = Number(localStorage.getItem(LAST_SEEN_KEY) || 0);
      if (isExpired(lastSeen)) {
        logout();
        return;
      }

      let lastWrite = Date.now();
      localStorage.setItem(LAST_SEEN_KEY, String(lastWrite));

      const touch = () => {
        const t = Date.now();
        if (t - lastWrite < WRITE_THROTTLE_MS) return;
        lastWrite = t;
        localStorage.setItem(LAST_SEEN_KEY, String(t));
      };

      ['click', 'keydown', 'scroll', 'touchstart', 'pointerdown'].forEach(evt =>
        window.addEventListener(evt, touch, { passive: true })
      );

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        const t = Number(localStorage.getItem(LAST_SEEN_KEY) || 0);
        if (isExpired(t)) logout();
      });

      window.addEventListener('pageshow', (e) => {
        if (e.persisted && !localStorage.getItem('nexoraUser')) {
          location.replace(LOGIN_PAGE);
        }
      });

      setInterval(() => {
        const t = Number(localStorage.getItem(LAST_SEEN_KEY) || 0);
        if (!t) return;
        if (isExpired(t)) { logout(); return; }
      }, 15_000);
    })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="i18n.js" defer></script>

    <style>
        :root {
            --bg-dark: #050505;
            --bg-panel: #0f0f12;
            --bg-panel-hover: #17171b;
            --primary-bright: #f0b90b;
            --primary-glow: rgba(240,185,11,0.35);
            --primary-teal: #1ebba3;
            --primary-red: #f23645;
            --primary-green: #2ecc71;
            --text-white: #ffffff;
            --text-gray: #9b9ba3;
            --border-color: #2a2a2e;
            --input-bg: #141418;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --sidebar-bg-top: #14120a;
            --sidebar-bg-bottom: #000000;
            --sidebar-hover: rgba(240,185,11,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0;
            padding: 0;
            background: #050505 !important;
            overscroll-behavior-y: none;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        body {
            background: linear-gradient(180deg, #131315 0%, #070708 45%, #030303 100%) fixed;
            color: var(--text-white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        body[dir="rtl"] { direction: rtl; text-align: right; }
        body[dir="rtl"] .sidebar { left: auto; right: -320px; }
        body[dir="rtl"] .sidebar.active { right: 0; left: auto; }
        body[dir="rtl"] .sidebar-nav li a { flex-direction: row-reverse; }
        body[dir="rtl"] .notif-panel { right: auto; left: 12px; }
        body[dir="rtl"] .notif-badge { right: auto; left: -8px; }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }

        /* ================= GLOBAL LOADER ================= */
        .global-loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.82); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .global-loader-overlay.active { opacity: 1; visibility: visible; }
        .ios-spinner { position: relative; width: 48px; height: 48px; animation: iosSpinDecay 1.2s cubic-bezier(0.45, 0.05, 0.15, 1) infinite; }
        .ios-spinner .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; background-color: var(--primary-bright); box-shadow: 0 0 12px rgba(240,185,11,0.5); }
        .ios-spinner .dot:nth-child(1) { top: 0; left: 50%; transform: translateX(-50%); }
        .ios-spinner .dot:nth-child(2) { bottom: 6px; right: 4px; }
        .ios-spinner .dot:nth-child(3) { bottom: 6px; left: 4px; }
        @keyframes iosSpinDecay { 0% { transform: rotate(0deg); } 100% { transform: rotate(1080deg); } }

        /* ================= TOAST ================= */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 99999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
        .toast { background: #141414; border: 1px solid #2a2a2e; color: white; padding: 15px 20px; border-radius: 8px; display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); animation: slideDown 0.3s ease; pointer-events: auto; }
        .toast.error { border-left: 4px solid var(--primary-red); }
        .toast.success { border-left: 4px solid var(--primary-teal); }
        .toast.info { border-left: 4px solid var(--primary-bright); }
        .toast svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
        .toast.error svg { fill: var(--primary-red); }
        .toast.success svg { fill: var(--primary-teal); }
        .toast.info svg { fill: var(--primary-bright); }
        .toast-text { font-size: 14px; line-height: 1.4; }

        /* ================= HEADER ================= */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background-color: rgba(0,0,0,0.92); border-bottom: 1px solid rgba(240,185,11,0.25); position: sticky; top: 0; z-index: 1000; width: 100%; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); flex-shrink: 0; }
        .header-icon { width: 28px; height: 28px; fill: #ffffff; cursor: pointer; flex-shrink: 0; }
        .header-logo { display: flex; align-items: center; gap: 10px; min-width: 0; }

        /* ============ NOTIFICATIONS ============ */
        .notif-btn { position: relative; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .notif-btn svg { width: 26px; height: 26px; fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transform-origin: 50% 10%; }
        .notif-btn.ring svg { animation: bellRing 0.9s ease; }
        @keyframes bellRing { 0% { transform: rotate(0); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-16deg); } 45% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 75% { transform: rotate(4deg); } 100% { transform: rotate(0); } }
        .notif-badge { position: absolute; top: -7px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--primary-red); color: #fff; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; border: 2px solid #000; line-height: 1; }
        .notif-badge.active { display: flex; }

        .notif-panel { position: fixed; top: 64px; right: 12px; width: 380px; max-width: calc(100vw - 24px); max-height: 70vh; background: var(--bg-panel); border: 1px solid rgba(240,185,11,0.25); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 1500; display: none; flex-direction: column; overflow: hidden; animation: slideUp 0.25s ease; }
        .notif-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #f0b90b, transparent); }
        .notif-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 12px; border-bottom: 1px solid var(--border-color); }
        .notif-panel-header h3 { font-size: 16px; font-weight: 700; color: white; }
        .notif-mark-all { font-size: 12px; font-weight: 600; color: var(--primary-bright); padding: 4px 0; }
        .notif-mark-all:hover { text-decoration: underline; }
        .notif-list { overflow-y: auto; flex: 1; }
        .notif-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.2s; position: relative; }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: rgba(240,185,11,0.05); }
        .notif-item.unread { background: rgba(240,185,11,0.07); }
        .notif-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(240,185,11,0.14); color: var(--primary-bright); }
        .notif-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .notif-icon.deposit { background: rgba(30, 187, 163, 0.15); color: var(--primary-teal); }
        .notif-icon.withdrawal { background: rgba(242, 54, 69, 0.15); color: var(--primary-red); }
        .notif-icon.alert { background: rgba(242, 54, 69, 0.15); color: var(--primary-red); }
        .notif-icon.kyc { background: rgba(212, 160, 23, 0.15); color: #f0c040; }
        .notif-icon.bonus { background: rgba(30, 187, 163, 0.15); color: var(--primary-teal); }
        .notif-icon.copytrade { background: rgba(240,185,11,0.14); color: #fcd535; }
        .notif-body { flex: 1; min-width: 0; }
        .notif-title { font-size: 14px; font-weight: 600; color: white; line-height: 1.3; margin-bottom: 2px; }
        .notif-text { font-size: 13px; color: var(--text-gray); line-height: 1.45; word-wrap: break-word; overflow-wrap: anywhere; }
        .notif-time { font-size: 11px; color: #808080; margin-top: 5px; }
        .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-bright); box-shadow: 0 0 8px var(--primary-bright); flex-shrink: 0; margin-top: 6px; visibility: hidden; }
        .notif-item.unread .notif-dot { visibility: visible; }
        .notif-empty { padding: 40px 20px; text-align: center; color: var(--text-gray); font-size: 13px; }

        /* ================= SIDEBAR ================= */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1999; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar { position: fixed; top: 0; left: -110%; width: 300px; max-width: 85vw; height: 100vh; height: 100dvh; background: linear-gradient(180deg, var(--sidebar-bg-top) 0%, var(--sidebar-bg-bottom) 100%); z-index: 2000; padding: 0; transition: left 0.3s ease; box-shadow: 5px 0 25px rgba(0,0,0,0.8); display: flex; flex-direction: column; border-right: 1px solid rgba(240,185,11,0.18); }
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 16px 20px 24px; display: flex; align-items: center; gap: 12px; }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 0 15px; }
        .sidebar-nav ul { display: flex; flex-direction: column; gap: 5px; }
        .sidebar-nav li a { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-radius: 8px; color: #e0e0e0; font-size: 16px; font-weight: 500; transition: all 0.2s; }
        .sidebar-nav li a:hover, .sidebar-nav li.active a { background-color: var(--sidebar-hover); color: #f0b90b; }
        .sidebar-nav li a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .sidebar-nav li a .sign-out { fill: currentColor; stroke: none; }
        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(240,185,11,0.15); }

        /* ================= APEX LOGO ================= */
        .ltm-logo { width: 40px; height: 40px; flex-shrink: 0; display: block; filter: drop-shadow(0 4px 14px rgba(240,185,11,0.18)); }
        .sidebar-header .ltm-logo { width: 48px; height: 48px; }

        .logo-text h1 { font-size: 17px; font-weight: 800; letter-spacing: 1.2px; line-height: 1; }
        .logo-text span { font-size: 8px; letter-spacing: 1.8px; color: #9a9aa3; margin-top: 2px; display: block; font-weight: 600; }
        .sidebar-header .logo-text h1 { font-size: 22px; }
        .sidebar-header .logo-text span { font-size: 9px; color: #ddd; letter-spacing: 1.8px; }

        /* ================= MAIN CHAT LAYOUT ================= */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-intro {
            text-align: center;
            margin: 20px auto 30px auto;
            max-width: 400px;
        }
        .chat-intro-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(240,185,11,0.1);
            border: 1.5px solid rgba(240,185,11,0.3);
            color: var(--primary-bright);
            box-shadow: 0 0 24px rgba(240,185,11,0.15);
        }
        .chat-intro-icon svg { width: 34px; height: 34px; fill: currentColor; }
        .chat-intro h2 {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .chat-intro p {
            font-size: 14px;
            color: var(--text-gray);
            line-height: 1.55;
        }

        /* MESSAGES */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.45;
            position: relative;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }
        .message.incoming {
            background: linear-gradient(160deg, #0f0f12, #17171b);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .message.outgoing {
            background: linear-gradient(135deg, #f0b90b 0%, #fcd535 100%);
            color: #0a0a0a;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(240,185,11,0.2);
        }
        .msg-time {
            display: block;
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.65;
            text-align: right;
            font-weight: 500;
        }
        .message.incoming .msg-time { text-align: left; }

        /* INPUT AREA */
        .chat-input-area {
            padding: 12px 16px;
            background: rgba(0,0,0,0.92);
            border-top: 1px solid rgba(240,185,11,0.2);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .chat-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 13px 20px;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        .chat-input::placeholder { color: #6c6c75; }
        .chat-input:focus { border-color: var(--primary-bright); box-shadow: 0 0 0 3px rgba(240,185,11,0.15); }
        .btn-send {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #f0b90b 0%, #fcd535 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(240,185,11,0.25);
        }
        .btn-send:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(240,185,11,0.35); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { opacity: 0.5; cursor: wait; }
        .btn-send svg { width: 20px; height: 20px; fill: #0a0a0a; margin-left: -2px; }

        /* ================= LOGO TEXT ALIGNMENT ================= */
        .logo-text, .brand-splash-text { display: inline-flex; flex-direction: column; align-items: stretch; }
        .logo-text h1, .brand-splash-text h1 { display: flex; justify-content: space-between; letter-spacing: 0 !important; font-weight: 800 !important; padding: 0 !important; line-height: 1; background: none !important; -webkit-text-fill-color: #f0b90b !important; color: #f0b90b !important; filter: none !important; }
        .logo-text h1 { font-size: 20px !important; }
        .sidebar-header .logo-text h1 { font-size: 22px !important; }
        .logo-text h1 span, .brand-splash-text h1 span { display: block; font-size: inherit; font-weight: inherit; letter-spacing: 0; margin: 0; padding: 0; color: inherit; -webkit-text-fill-color: inherit; }
        .logo-text > span { text-align: justify; text-align-last: justify; margin-right: 0 !important; color: #9d9d9d !important; }

        @media (max-width: 360px) { .chat-container { padding: 15px 12px; } .chat-input-area { padding: 10px 12px; } .chat-input { padding: 12px 16px; } }
    </style>
</head>

                <li><a href="./referral.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="menu_referral">Referral Program</span></a></li>
                <li><a href="./kyc.html" class="nav-link"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M7 15h4"/></svg><span data-i18n="menu_kyc">KYC</span></a></li>
                <li><a href="./settings.html" class="nav-link"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg><span data-i18n="menu_settings">Settings</span></a></li>
                <li class="active"><a href="./support.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg><span data-i18n="menu_support">Support</span></a></li>
                <li style="margin-top:20px;"><a href="#" onclick="logout(); return false;"><svg class="sign-out" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg><span data-i18n="menu_signout">Sign Out</span></a></li>
            </ul>
        </div>
        <div class="sidebar-footer"><div data-lang-dd></div></div>
    </div>

    <header class="app-header">
        <svg class="header-icon" id="hamburgerBtn" viewBox="0 0 24 24" onclick="openSidebar()"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        <div class="header-logo">
            <svg class="ltm-logo" role="img" aria-label="Apex Trade Market logo"><use href="#ltmMark"/></svg>
            <div class="logo-text">
                <h1>APEX</h1>
                <span>TRADE MARKET</span>
            </div>
        </div>
        <div class="notif-btn" id="notifBtn" onclick="toggleNotifPanel(event)" aria-label="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-badge" id="notifBadge">0</span>
        </div>
    </header>

    <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-header">
            <h3>Notifications</h3>
            <button class="notif-mark-all" onclick="markAllNotifRead()">Mark all as read</button>
        </div>
        <div class="notif-list" id="notifList"></div>
    </div>

    <div class="main-wrapper">
        <div class="chat-container" id="chatContainer">
            <div class="chat-intro" id="chatIntro">
                <div class="chat-intro-icon">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h2>Live Support</h2>
                <p>Our support team is online. Send us a message below and we will get back to you shortly.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://apexline-market.onrender.com';

        const loader = document.getElementById('globalLoader');
        function showLoader() { loader.classList.add('active'); }
        function hideLoader() { loader.classList.remove('active'); }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let iconSvg = '';
            if (type === 'success') iconSvg = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
            else if (type === 'error') iconSvg = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';
            else iconSvg = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>';
            toast.innerHTML = `${iconSvg}<div class="toast-text">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ================= AUTH =================
        const userStr = localStorage.getItem('nexoraUser');
        if (!userStr) {
            window.location.replace('index.html');
            throw new Error('Not authenticated');
        }

        let currentUser;
        try {
            currentUser = JSON.parse(userStr);
        } catch (e) {
            ['nexoraUser','nexoraToken','nexoraJoinedAt','nexoraLastSeen'].forEach(k => localStorage.removeItem(k));
            window.location.replace('index.html');
            throw new Error('Invalid auth state');
        }

        // ================= NOTIFICATIONS =================
        const NOTIF_KEY = `apexNotif_${currentUser.id}`;
        const NOTIF_ICONS = {
            welcome:    '<path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>',
            login:      '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
            deposit:    '<path d="M12 19V5M5 12l7-7 7 7"/>',
            withdrawal: '<path d="M12 5v14M5 12l7 7 7-7"/>',
            copytrade:  '<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
            trade:      '<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>',
            kyc:        '<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M7 15h4"/>',
            bonus:      '<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
            alert:      '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
        };

        function loadNotifState() {
            try {
                const s = JSON.parse(localStorage.getItem(NOTIF_KEY) || 'null');
                if (s && typeof s === 'object') {
                    return { init: !!s.init, read: Array.isArray(s.read) ? s.read : [], seen: s.seen || {}, local: Array.isArray(s.local) ? s.local : [] };
                }
            } catch (e) {}
            return { init: false, read: [], seen: {}, local: [] };
        }
        function saveNotifState() {
            try { localStorage.setItem(NOTIF_KEY, JSON.stringify(notifState)); } catch (e) {}
        }

        let notifState = loadNotifState();
        let notifSources = { txns: [], kyc: null, suspended: false, txnsLoaded: false, accountLoaded: false };
        let notifPanelOpen = false;

        function seedLocalEvents() {
            notifState = loadNotifState();
            const first = ((currentUser.full_name || '').split(' ')[0]) || 'there';
            const hasWelcome = notifState.local.some(e => e.id === 'welcome');
            if (!hasWelcome) {
                notifState.local.push({
                    id: 'welcome', kind: 'welcome',
                    title: `Welcome to Apex Trade Market, ${first}!`,
                    text: 'Your account is ready. Deposit funds, verify your identity and start trading or copy an expert trader. Everything happening on your account will appear here.',
                    time: Date.now()
                });
            } else if (!sessionStorage.getItem('apexLoginNotified')) {
                notifState.local.push({
                    id: 'login-' + Date.now(), kind: 'login',
                    title: 'Signed in', text: 'You signed in to your account.', time: Date.now()
                });
                const logins = notifState.local.filter(e => e.kind === 'login');
                if (logins.length > 10) {
                    const drop = new Set(logins.slice(0, logins.length - 10).map(e => e.id));
                    notifState.local = notifState.local.filter(e => !drop.has(e.id));
                }
            }
            try { sessionStorage.setItem('apexLoginNotified', '1'); } catch (e) {}
            saveNotifState();
        }

        function getNotifSym() {
            if (currentUser && currentUser.currency && currentUser.currency.symbol) return currentUser.currency.symbol;
            const c = currentUser && currentUser.country;
            if (c === 'France' || c === 'Germany') return '€';
            if (c === 'United Kingdom') return '£';
            if (c === 'Canada') return 'C$';
            if (c === 'Australia') return 'A$';
            if (c === 'Nigeria') return '₦';
            return '$';
        }

        function describeTxn(txn) {
            const sym = getNotifSym();
            const amt = `${sym}${txn.amount_display || parseFloat(txn.amount || 0).toFixed(2)}`;
            const status = (txn.status || '').toLowerCase();
            switch (txn.type) {
                case 'Deposit':
                    if (status === 'pending')  return { kind: 'deposit', title: 'Deposit pending', text: `Your deposit of ${amt} is awaiting confirmation.` };
                    if (status === 'rejected') return { kind: 'alert', title: 'Deposit rejected', text: `Your deposit of ${amt} was not approved. Contact support if you need help.` };
                    return { kind: 'deposit', title: 'Deposit approved', text: `${amt} has been added to your balance.` };
                case 'Withdrawal':
                    if (status === 'pending')  return { kind: 'withdrawal', title: 'Withdrawal requested', text: `Your withdrawal of ${amt} is awaiting approval.` };
                    if (status === 'rejected') return { kind: 'alert', title: 'Withdrawal rejected', text: `Your withdrawal of ${amt} was not approved. Contact support if you need help.` };
                    return { kind: 'withdrawal', title: 'Withdrawal approved', text: `Your withdrawal of ${amt} has been approved.` };
                case 'Copy Out':
                case 'Copy Trade':
                    return { kind: 'copytrade', title: 'Copy trade started', text: `${amt} was allocated to a copy trade.` };
                case 'Copy In':
                    return { kind: 'copytrade', title: 'Copy trade closed', text: `${amt} was returned to your balance.` };
                case 'Crypto':
                case 'Forex':
                case 'Trade': {
                    const label = txn.type === 'Trade' ? 'Trade' : `${txn.type} trade`;
                    if (status === 'rejected') return { kind: 'alert', title: `${label} failed`, text: `Your ${label.toLowerCase()} of ${amt} could not be completed.` };
                    return { kind: 'trade', title: `${label} placed`, text: `Your ${label.toLowerCase()} of ${amt} was placed successfully.` };
                }
                case 'Referral Bonus':
                case 'Bonus':
                    return { kind: 'bonus', title: 'Bonus received', text: `You received a bonus of ${amt}.` };
                case 'Profit':
                    return { kind: 'bonus', title: 'Profit credited', text: `${amt} profit was credited to your balance.` };
                case 'Refund':
                    return { kind: 'deposit', title: 'Refund issued', text: `${amt} was refunded to your balance.` };
                default:
                    return { kind: 'trade', title: txn.type || 'Account activity', text: `${txn.type || 'Activity'} of ${amt}${txn.status ? ' — ' + txn.status : ''}.` };
            }
        }

        function buildNotifCandidates() {
            const list = [];
            const txns = (notifSources.txns || []).slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 50);
            txns.forEach(txn => {
                const d = describeTxn(txn);
                const tid = txn.id != null ? txn.id : `${txn.type}|${txn.created_at}|${txn.amount}`;
                const t = new Date(txn.created_at).getTime();
                list.push({ id: `txn:${tid}:${txn.status}`, kind: d.kind, title: d.title, text: d.text, srcTime: Number.isFinite(t) ? t : Date.now() });
            });

            const kyc = notifSources.kyc;
            if (kyc && kyc.status) {
                const t = new Date(kyc.submitted_at).getTime();
                const srcTime = Number.isFinite(t) ? t : Date.now();
                const kid = `kyc:${kyc.status}:${kyc.submitted_at || ''}`;
                if (kyc.status === 'Approved') list.push({ id: kid, kind: 'kyc', title: 'Identity verified', text: 'Your KYC was approved. You now have full access and higher withdrawal limits.', srcTime });
                else if (kyc.status === 'Rejected') list.push({ id: kid, kind: 'alert', title: 'KYC not approved', text: kyc.rejection_reason ? `Reason: ${kyc.rejection_reason}` : 'Your documents could not be verified. Please resubmit clearer documents.', srcTime });
                else list.push({ id: kid, kind: 'kyc', title: 'KYC under review', text: 'We received your documents and our team is reviewing them.', srcTime });
            }

            if (notifSources.suspended) {
                list.push({ id: 'account:suspended', kind: 'alert', title: 'Account suspended', text: 'Your account has been suspended. Please contact support for assistance.', srcTime: Date.now() });
            }
            return list;
        }

        function getNotifItems() {
            const read = new Set(notifState.read);
            const items = notifState.local.map(e => ({ id: e.id, kind: e.kind, title: e.title, text: e.text, time: e.time }));
            buildNotifCandidates().forEach(c => {
                if (c.id in notifState.seen) items.push({ id: c.id, kind: c.kind, title: c.title, text: c.text, time: notifState.seen[c.id] });
            });
            items.sort((a, b) => b.time - a.time);
            items.forEach(i => { i.read = read.has(i.id); });
            return items.slice(0, 60);
        }

        function timeAgo(ts) {
            const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
            if (s < 60) return 'Just now';
            const m = Math.floor(s / 60);
            if (m < 60) return `${m} min ago`;
            const h = Math.floor(m / 60);
            if (h < 24) return `${h} hour${h > 1 ? 's' : ''} ago`;
            const d = Math.floor(h / 24);
            if (d < 7) return `${d} day${d > 1 ? 's' : ''} ago`;
            return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function renderNotifications() {
            const items = getNotifItems();
            const unread = items.filter(i => !i.read).length;

            const badge = document.getElementById('notifBadge');
            if (badge) {
                badge.innerText = unread > 99 ? '99+' : String(unread);
                badge.classList.toggle('active', unread > 0);
            }

            const list = document.getElementById('notifList');
            if (!list) return;
            if (items.length === 0) {
                list.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
                return;
            }
            list.innerHTML = items.map(i => `
                <div class="notif-item ${i.read ? '' : 'unread'}" data-id="${escapeHtml(i.id)}">
                    <div class="notif-icon ${escapeHtml(i.kind)}"><svg viewBox="0 0 24 24">${NOTIF_ICONS[i.kind] || NOTIF_ICONS.trade}</svg></div>
                    <div class="notif-body">
                        <div class="notif-title">${escapeHtml(i.title)}</div>
                        <div class="notif-text">${escapeHtml(i.text)}</div>
                        <div class="notif-time">${timeAgo(i.time)}</div>
                    </div>
                    <span class="notif-dot"></span>
                </div>
            `).join('');
        }

        function syncNotifications() {
            const stored = loadNotifState();
            notifState.read = Array.from(new Set([...stored.read, ...notifState.read]));
            notifState.seen = Object.assign({}, stored.seen, notifState.seen);
            notifState.init = notifState.init || stored.init;

            const cands = buildNotifCandidates();
            const ready = notifSources.txnsLoaded && notifSources.accountLoaded;
            const justInit = !notifState.init && ready;
            const arrived = [];

            cands.forEach(c => {
                if (c.id in notifState.seen) return;
                if (justInit) {
                    notifState.seen[c.id] = c.srcTime;
                    notifState.read.push(c.id);
                } else if (notifState.init) {
                    notifState.seen[c.id] = Date.now();
                    arrived.push(c);
                }
            });
            if (justInit) notifState.init = true;
            if (notifState.read.length > 500) notifState.read = notifState.read.slice(-500);
            saveNotifState();
            renderNotifications();

            if (arrived.length) {
                const btn = document.getElementById('notifBtn');
                if (btn) { btn.classList.add('ring'); setTimeout(() => btn.classList.remove('ring'), 900); }
                arrived.slice(0, 2).forEach(c => showToast('info', escapeHtml(c.title)));
            }
        }

        async function refreshNotifSources() {
            if (!currentUser || !currentUser.id) return;
            try {
                const res = await fetch(`${API_BASE_URL}/user/${currentUser.id}`);
                const data = await res.json();
                if (data.success && data.user) notifSources.suspended = !!data.user.is_suspended;
                if (data.currency) {
                    currentUser.currency = data.currency;
                    localStorage.setItem('nexoraUser', JSON.stringify(currentUser));
                }
            } catch (e) { /* keep previous value */ }
            finally { notifSources.accountLoaded = true; }

            try {
                const kycRes = await fetch(`${API_BASE_URL}/kyc/status/${currentUser.id}`);
                const kycData = await kycRes.json();
                notifSources.kyc = (kycRes.ok && kycData.success && kycData.kyc && kycData.kyc.status) ? kycData.kyc : null;
            } catch (e) { /* optional */ }

            try {
                const txRes = await fetch(`${API_BASE_URL}/transactions/${currentUser.id}`);
                const txData = await txRes.json();
                if (txData.success && txData.transactions) {
                    notifSources.txns = txData.transactions;
                    notifSources.txnsLoaded = true;
                }
            } catch (e) { /* optional */ }

            syncNotifications();
        }

        function markNotifRead(id) {
            if (!notifState.read.includes(id)) {
                notifState.read.push(id);
                saveNotifState();
                renderNotifications();
            }
        }

        function markAllNotifRead() {
            getNotifItems().forEach(i => { if (!notifState.read.includes(i.id)) notifState.read.push(i.id); });
            saveNotifState();
            renderNotifications();
        }

        function openNotifPanel() {
            document.getElementById('notifPanel').style.display = 'flex';
            notifPanelOpen = true;
            renderNotifications();
        }
        function closeNotifPanel() {
            document.getElementById('notifPanel').style.display = 'none';
            notifPanelOpen = false;
            markAllNotifRead();
        }
        function toggleNotifPanel(e) {
            if (e) e.stopPropagation();
            if (notifPanelOpen) closeNotifPanel(); else openNotifPanel();
        }

        document.addEventListener('click', (e) => {
            if (!notifPanelOpen) return;
            if (e.target.closest('#notifPanel') || e.target.closest('#notifBtn')) return;
            closeNotifPanel();
        });
        document.getElementById('notifList').addEventListener('click', (e) => {
            const item = e.target.closest('.notif-item');
            if (item && item.dataset.id) markNotifRead(item.dataset.id);
        });
        // ================= END NOTIFICATIONS =================

        // ================= CHAT =================
        let chatInterval = null;
        let hasLoadedOnce = false;

        async function loadMessages() {
            try {
                if (!hasLoadedOnce) showLoader();

                const response = await fetch(`${API_BASE_URL}/support/messages/${currentUser.id}`);
                const data = await response.json();

                if (data.success && data.messages) {
                    renderMessages(data.messages);
                }
            } catch (error) {
                console.error("Failed to load messages:", error);
            } finally {
                if (!hasLoadedOnce) {
                    hideLoader();
                    hasLoadedOnce = true;
                }
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatContainer');
            const intro = document.getElementById('chatIntro');

            if (messages.length > 0) {
                intro.style.display = 'none';
            } else {
                intro.style.display = 'block';
                const existingMessages = container.querySelectorAll('.message');
                existingMessages.forEach(msg => msg.remove());
                return;
            }

            const renderedIds = new Set();
            container.querySelectorAll('.message').forEach(msg => {
                renderedIds.add(msg.dataset.id);
            });

            let hasNewMessages = false;

            messages.forEach(msg => {
                if (!renderedIds.has(String(msg.id))) {
                    hasNewMessages = true;

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.sender === 'user' ? 'outgoing' : 'incoming'}`;
                    msgDiv.dataset.id = msg.id;

                    const date = new Date(msg.created_at);
                    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    const safeText = escapeHtml(msg.message).replace(/\n/g, "<br>");

                    msgDiv.innerHTML = `
                        ${safeText}
                        <span class="msg-time">${timeStr}</span>
                    `;

                    container.appendChild(msgDiv);
                }
            });

            if (hasNewMessages) scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            input.value = '';

            try {
                const response = await fetch(`${API_BASE_URL}/support/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        message: message
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    await loadMessages();
                } else {
                    showToast('error', data.message || 'Failed to send message.');
                    input.value = message;
                }
            } catch (error) {
                console.error("Error sending message:", error);
                showToast('error', 'Connection error. Please try again.');
                input.value = message;
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // ================= INIT =================
        document.addEventListener('DOMContentLoaded', () => {
            seedLocalEvents();
            renderNotifications();
            setInterval(renderNotifications, 60000);
            refreshNotifSources();
            setInterval(refreshNotifSources, 30000);

            loadMessages().then(scrollToBottom);
            chatInterval = setInterval(loadMessages, 5000);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(chatInterval);
            } else {
                clearInterval(chatInterval);
                chatInterval = setInterval(loadMessages, 5000);
                loadMessages();
            }
        });

        // ================= SIDEBAR =================
        function openSidebar() {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('sidebarOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => closeSidebar());
        });

        function logout() {
            ['nexoraUser', 'nexoraToken', 'nexoraJoinedAt', 'nexoraLastSeen', `apexLiveTrade_${currentUser.id}`]
                .forEach(k => localStorage.removeItem(k));
            ['popupShown', 'nexoraState', 'nexoraDepositPopupShown', 'apexLoginAnimShown', 'apexLoginNotified']
                .forEach(k => sessionStorage.removeItem(k));
            window.location.replace('index.html');
        }
    </script>

<script>
document.querySelectorAll('.logo-text h1, .brand-splash-text h1').forEach(h => {
    const text = h.textContent.trim();
    h.setAttribute('aria-label', text);
    h.innerHTML = [...text].map(c => '<span aria-hidden="true">' + c + '</span>').join('');
});
</script>

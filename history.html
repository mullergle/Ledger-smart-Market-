<script>
(function () {
  const IDLE_TIMEOUT_MS = 30 * 60 * 1000;
  const WARN_BEFORE_MS = 2 * 60 * 1000;
  const LOGIN_PAGE = 'index.html';
  const LAST_SEEN_KEY = 'nexoraLastSeen';
  const WRITE_THROTTLE_MS = 30_000;
  const currentPage = location.pathname.split('/').pop() || 'index.html';
  const isLoginPage = currentPage === LOGIN_PAGE;
  const AUTH_KEYS = ['nexoraUser','nexoraToken','nexoraJoinedAt','nexoraLastSeen'];
  const SESSION_KEYS = ['popupShown','nexoraState'];
  const clearAuth = () => { AUTH_KEYS.forEach(k => localStorage.removeItem(k)); SESSION_KEYS.forEach(k => sessionStorage.removeItem(k)); };
  const logout = () => { clearAuth(); if (!isLoginPage) location.replace(LOGIN_PAGE); };
  const isExpired = (t) => t > 0 && (Date.now() - t) > IDLE_TIMEOUT_MS;
  if (!isLoginPage && !localStorage.getItem('nexoraUser')) { location.replace(LOGIN_PAGE); return; }
  const lastSeen = Number(localStorage.getItem(LAST_SEEN_KEY) || 0);
  if (isExpired(lastSeen)) { logout(); return; }
  let lastWrite = Date.now();
  localStorage.setItem(LAST_SEEN_KEY, String(lastWrite));
  const touch = () => { const t = Date.now(); if (t - lastWrite < WRITE_THROTTLE_MS) return; lastWrite = t; localStorage.setItem(LAST_SEEN_KEY, String(t)); };
  ['click','keydown','scroll','touchstart','pointerdown'].forEach(evt => window.addEventListener(evt, touch, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; const t = Number(localStorage.getItem(LAST_SEEN_KEY) || 0); if (isExpired(t)) logout(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted && !localStorage.getItem('nexoraUser')) location.replace(LOGIN_PAGE); });
  setInterval(() => {
    const t = Number(localStorage.getItem(LAST_SEEN_KEY) || 0);
    if (!t) return;
    if (isExpired(t)) { logout(); return; }
    const remaining = IDLE_TIMEOUT_MS - (Date.now() - t);
    if (remaining > 0 && remaining < WARN_BEFORE_MS) console.warn(`Auto-logout in ${Math.ceil(remaining / 1000)}s`);
  }, 15_000);
})();
</script>

<script>
const API_BASE_URL = 'https://apexline-market.onrender.com';

const userStr = localStorage.getItem('nexoraUser');
if (!userStr) { window.location.replace('index.html'); throw new Error('Not authenticated'); }
let currentUser;
try { currentUser = JSON.parse(userStr); }
catch (e) {
  ['nexoraUser','nexoraToken','nexoraJoinedAt','nexoraLastSeen'].forEach(k => localStorage.removeItem(k));
  window.location.replace('index.html'); throw new Error('Invalid auth state');
}

const loader = document.getElementById('globalLoader');
const showLoader = () => loader.classList.remove('hide');
const hideLoader = () => loader.classList.add('hide');

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ---------- Currency (matches dashboard getCurrencyData) ---------- */
let currencySym = '$', currencyCode = 'USD';
(function () {
  if (currentUser && currentUser.currency && currentUser.currency.symbol) {
    currencyCode = currentUser.currency.code || 'USD';
    currencySym = currentUser.currency.symbol || '$';
    return;
  }
  const map = {
    'France':['€','EUR'],'Germany':['€','EUR'],'Spain':['€','EUR'],'Italy':['€','EUR'],'Portugal':['€','EUR'],
    'Netherlands':['€','EUR'],'Belgium':['€','EUR'],'Austria':['€','EUR'],'Ireland':['€','EUR'],
    'United Kingdom':['£','GBP'],'Canada':['C$','CAD'],'Australia':['A$','AUD'],'Japan':['¥','JPY'],'Nigeria':['₦','NGN']
  };
  const m = currentUser && map[currentUser.country];
  if (m) { currencySym = m[0]; currencyCode = m[1]; }
})();

/* ---------- Sound Engine (No external files, 100% reliable) ---------- */
function playSuccessSound() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();

    const playBeep = (freq, startTime, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
      
      gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
      
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.start(ctx.currentTime + startTime);
      osc.stop(ctx.currentTime + startTime + duration);
    };

    playBeep(1200, 0, 0.1);
    playBeep(1600, 0.12, 0.15);
  } catch (e) {
    console.warn("Audio play failed:", e);
  }
}

/* ---------- Type metadata ---------- */
const CREDIT_TYPES = new Set(['Deposit','Copy In','Bonus','Refund','Profit','Referral Bonus']);
// ✅ Using the original DEBIT_TYPES without 'Trade Result'
const DEBIT_TYPES  = new Set(['Withdrawal','Copy Out','Trade','Crypto','Forex']); 
const COPY_SVG = '<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>';
const TRADE_SVG = '<path d="M3 3v18h18M7 14l4-4 4 4 5-6"/>';
const GIFT_SVG = '<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>';
const TYPE_META = {
  'Deposit':        { iconClass:'deposit',    svg:'<path d="M12 19V5M5 12l7-7 7 7"/>', label:'Deposit', sublabel:'Funds Added' },
  'Withdrawal':     { iconClass:'withdrawal', svg:'<path d="M12 5v14M5 12l7 7 7-7"/>', label:'Withdrawal', sublabel:'Funds Out' },
  'Trade':          { iconClass:'trade',      svg:TRADE_SVG, label:'Trade', sublabel:'Market Order' },
  'Crypto':         { iconClass:'trade',      svg:TRADE_SVG, label:'Crypto Trade', sublabel:'Market Order' },
  'Forex':          { iconClass:'trade',      svg:TRADE_SVG, label:'Forex Trade', sublabel:'Market Order' },
  'Copy Trade':     { iconClass:'copytrade',  svg:COPY_SVG,  label:'Copy Trade', sublabel:'Copy Trading' },
  'Copy Out':       { iconClass:'copyout',    svg:COPY_SVG,  label:'Copy Trade Started', sublabel:'Funds Invested' },
  'Copy In':        { iconClass:'copyin',     svg:'<path d="M20 4L4 20M15 20h5v-5M4 4h5v5"/>', label:'Copy Trade Closed', sublabel:'Funds Returned' },
  'Referral Bonus': { iconClass:'bonus',      svg:GIFT_SVG,   label:'Referral Bonus', sublabel:'Reward' },
  'Bonus':          { iconClass:'bonus',      svg:GIFT_SVG,   label:'Bonus', sublabel:'Reward' },
  'Profit':         { iconClass:'bonus',      svg:GIFT_SVG,   label:'Profit Credited', sublabel:'Earnings' },
  'Refund':         { iconClass:'deposit',    svg:'<path d="M12 19V5M5 12l7-7 7 7"/>', label:'Refund', sublabel:'Funds Returned' },
  'Trade Result':   { iconClass:'trade',      svg:TRADE_SVG, label:'Trade Result', sublabel:'Closed Position' } 
};
const getTypeMeta = type => TYPE_META[type] || { iconClass:'trade', svg:'<path d="M3 3v18h18M9 9l6 6M15 9l-6 6"/>', label:type || 'Transaction', sublabel:'Transaction' };

// ✅ FIX: Back to reading the amount as a positive number for all credits. 
// Since 'Trade Result' is no longer in DEBIT_TYPES, it will default to the amount logic, which is exactly what we want.
const isCredit = t => CREDIT_TYPES.has(t.type) ? true : DEBIT_TYPES.has(t.type) ? false : Number(t.amount) >= 0;

// ✅ FIX: Use Math.abs() to strip negative signs and display the full amount.
const amtDisplay = t => {
  const raw = String(t.amount_display || t.amount || '0').replace(/,/g, '');
  return Math.abs(parseFloat(raw) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const statusOf = t => (t.status || 'Approved').toLowerCase();
const refOf = t => 'APX-' + (t.id != null ? String(t.id).toUpperCase().padStart(8, '0') : new Date(t.created_at).getTime().toString(36).toUpperCase());

/* ---------- State ---------- */
let allTransactions = [];
let viewList = [];
let currentPage = 1;
let statusFilter = 'all';
let lastFetchedTopId = null; 
const PAGE_SIZE = 5;

/* ---------- Fetch ---------- */
async function fetchAllTrades(isPoll = false) {
  const listContainer = document.getElementById('tradeHistoryList');
  try {
    const response = await fetch(`${API_BASE_URL}/transactions/${currentUser.id}`);
    const data = await response.json();
    if (!data.success || !data.transactions) throw new Error('bad response');

    const sorted = data.transactions.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    
    // Sound trigger logic
    if (isPoll && sorted.length > 0) {
        const newestId = sorted[0].id;
        if (lastFetchedTopId !== null && newestId !== lastFetchedTopId) {
            const newestType = sorted[0].type;
            if (['Trade Result', 'Profit', 'Copy In'].includes(newestType)) {
                playSuccessSound();
                toast(`New ${getTypeMeta(newestType).label} added to history!`);
            }
        }
        lastFetchedTopId = newestId;
    } else if (!isPoll && sorted.length > 0) {
        lastFetchedTopId = sorted[0].id;
    }

    allTransactions = sorted;
    document.getElementById('countTotal').innerText = allTransactions.length;
    document.getElementById('countApproved').innerText = allTransactions.filter(t => statusOf(t) === 'approved').length;
    document.getElementById('countPending').innerText = allTransactions.filter(t => statusOf(t) === 'pending').length;
    document.getElementById('countRejected').innerText = allTransactions.filter(t => statusOf(t) === 'rejected').length;
    
    if (!isPoll || viewList.length !== allTransactions.length) {
        applyFilter();
    }

  } catch (error) {
    if (!isPoll) {
        console.error('Failed to fetch trades:', error);
        document.getElementById('paginationBar').style.display = 'none';
        listContainer.innerHTML = `<div class="empty-state" style="color:var(--primary-red)"><p>Failed to load your transactions.</p><button onclick="retry()">Try again</button></div>`;
    }
  } finally {
    if (!isPoll) hideLoader();
  }
}
function retry() { showLoader(); fetchAllTrades(); }

function applyFilter() {
  viewList = statusFilter === 'all' ? allTransactions : allTransactions.filter(t => statusOf(t) === statusFilter);
  if (!allTransactions.length) {
    document.getElementById('paginationBar').style.display = 'none';
    document.getElementById('tradeHistoryList').innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><p>No trades yet. Your history will appear here.</p></div>`;
    return;
  }
  if (!viewList.length) {
    document.getElementById('paginationBar').style.display = 'none';
    document.getElementById('tradeHistoryList').innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg><p>No ${esc(statusFilter)} transactions.</p></div>`;
    return;
  }
  document.getElementById('paginationBar').style.display = 'flex';
  renderTradePage(currentPage);
}

/* ---------- Render page ---------- */
function renderTradePage(page) {
  const listContainer = document.getElementById('tradeHistoryList');
  const totalPages = Math.max(1, Math.ceil(viewList.length / PAGE_SIZE));
  if (page < 1) page = 1;
  if (page > totalPages) page = totalPages;
  currentPage = page;

  const startIdx = (page - 1) * PAGE_SIZE;
  const endIdx = Math.min(startIdx + PAGE_SIZE, viewList.length);
  const pageItems = viewList.slice(startIdx, endIdx);

  listContainer.innerHTML = pageItems.map(txn => {
    const d = new Date(txn.created_at);
    const date = d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const time = d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    const meta = getTypeMeta(txn.type);
    const credit = isCredit(txn);
    const status = statusOf(txn);
    return `
      <button class="history-card" data-idx="${allTransactions.indexOf(txn)}" aria-label="View receipt for ${esc(meta.label)}">
        <div class="hc-top">
          <div class="hc-type-wrap">
            <div class="hc-icon ${meta.iconClass}"><svg viewBox="0 0 24 24">${meta.svg}</svg></div>
            <div class="hc-type-text"><h4>${esc(meta.label)}</h4><span>${esc(meta.sublabel)}</span></div>
          </div>
          <div class="hc-amount ${credit ? 'positive' : 'negative'}">${credit ? '+' : '-'}${esc(currencySym)}${esc(amtDisplay(txn))}</div>
        </div>
        <div class="hc-bottom">
          <div class="hc-date"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${esc(date)} • ${esc(time)}</div>
          <div class="hc-right">
            <span class="hc-receipt">Receipt <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span>
            <span class="premium-badge ${esc(status)}">${esc(txn.status || 'Approved')}</span>
          </div>
        </div>
      </button>`;
  }).join('');

  document.getElementById('prevPageBtn').disabled = page <= 1;
  document.getElementById('nextPageBtn').disabled = page >= totalPages;
  document.getElementById('paginationInfo').innerHTML = `Showing <strong>${startIdx + 1}–${endIdx}</strong> of <strong>${viewList.length}</strong> transactions`;
}

function changePage(direction) {
  const totalPages = Math.ceil(viewList.length / PAGE_SIZE);
  const newPage = currentPage + direction;
  if (newPage < 1 || newPage > totalPages) return;
  renderTradePage(newPage);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- Receipt ---------- */
let activeTxn = null;
const CHECK = '<path d="M5 13l4 4L19 7"/>', CLOCK = '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', CROSS = '<path d="M6 6l12 12M18 6L6 18"/>';

function openReceipt(t) {
  activeTxn = t;
  const desc = String(t.description || '');
  const meta = Object.assign({}, getTypeMeta(t.type));
  if (t.type === 'Withdrawal' && /^Bank Withdrawal/i.test(desc)) meta.label = 'Bank Withdrawal';
  const s = statusOf(t), credit = isCredit(t);
  const d = new Date(t.created_at);
  const dateStr = isNaN(d) ? '—' : d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  const timeStr = isNaN(d) ? '—' : d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const stLabel = s === 'approved' ? 'Completed' : s === 'pending' ? 'Pending' : 'Rejected';
  const stIcon = s === 'approved' ? CHECK : s === 'pending' ? CLOCK : CROSS;
  
  // ✅ FIX: Standardize the amount back to reading the whole amount
  const amount = amtDisplay(t);

  const extra = [];
  const add = (label, v) => { if (v !== undefined && v !== null && String(v).trim() !== '') extra.push([label, v]); };
  const methodRaw = String(t.method || t.payment_method || '');
  add('Method', /admin/i.test(methodRaw) ? '' : methodRaw);
  add('Network', t.network);
  add('Wallet / account', t.address || t.wallet_address || t.account);
  add('Pair', t.pair);
  add('Direction', t.action);
  add('Lot size', t.lot_size);
  add('Stop loss', t.stop_loss);
  const noteRaw = String(t.note || t.description || t.reason || '');
  add('Note', /admin/i.test(noteRaw) ? '' : noteRaw);

  const row = (k, v, cls) => `<div class="r-row"><span>${esc(k)}</span><span class="${cls || ''}">${esc(v)}</span></div>`;

  document.getElementById('receiptBody').innerHTML = `
    <div class="r-brand">
      <div><div class="name">LEDGER</div><div class="sub">SMART MARKET</div></div>
      <div class="doc">OFFICIAL RECEIPT</div>
    </div>
    <div class="r-status ${esc(s)}">
      <div class="ico"><svg viewBox="0 0 24 24">${stIcon}</svg></div>
      <div class="st">${stLabel}</div>
      <div class="r-amount">${credit ? '+' : '-'}${esc(currencySym)}${esc(amount)}</div>
      <div class="r-type">${esc(meta.label)}</div>
    </div>
    <div class="r-rows">
      ${row('Reference', refOf(t), 'ref')}
      ${row('Date', dateStr)}
      ${row('Time', timeStr)}
      ${row('Account holder', currentUser.full_name || '—')}
      ${currentUser.email ? row('Email', currentUser.email) : ''}
      ${row('Type', meta.label)}
      ${row('Status', t.status || 'Approved')}
      ${row('Currency', currencyCode)}
      ${extra.map(([k, v]) => row(k, v)).join('')}
    </div>
    <div class="r-total"><span>${credit ? 'Amount credited' : 'Amount debited'}</span><span>${esc(currencySym)}${esc(amount)}</span></div>
    <div class="r-foot">
      ${s === 'pending' ? 'This transaction is awaiting approval. Your balance will update once it is processed.<br>' : ''}
      ${s === 'rejected' ? 'This transaction was not approved. Contact support if you need help.<br>' : ''}
      Generated ${esc(new Date().toLocaleString('en-US'))}<br>Keep this receipt for your records.
    </div>`;
  document.getElementById('receiptModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
async function downloadReceipt() {
  if (!activeTxn) return;
  if (typeof html2canvas === 'undefined') { toast('Download tool failed to load. Refresh and try again.'); return; }
  const name = 'receipt-' + refOf(activeTxn) + '.png';
  try {
    toast('Preparing receipt...');
    const canvas = await html2canvas(document.getElementById('receiptBody'), { backgroundColor: '#ffffff', scale: 2, useCORS: true });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    if (!blob) throw new Error('Image could not be created');
    const file = new File([blob], name, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Receipt' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) {
    console.error('Receipt download failed:', e);
    toast('Download failed: ' + (e && e.message ? e.message : 'unknown error'));
  }
}
function closeReceipt() {
  document.getElementById('receiptModal').classList.remove('active');
  document.body.style.overflow = '';
  activeTxn = null;
}
function copyRef() {
  if (!activeTxn) return;
  const ref = refOf(activeTxn);
  const done = () => toast('Reference copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ref).then(done).catch(() => fallbackCopy(ref, done));
  else fallbackCopy(ref, done);
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); cb(); } catch (e) {} ta.remove();
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}

/* ---------- Events ---------- */
document.getElementById('tradeHistoryList').addEventListener('click', e => {
  const card = e.target.closest('.history-card'); if (!card) return;
  const t = allTransactions[Number(card.dataset.idx)]; if (t) openReceipt(t);
});
document.getElementById('historyStatsBar').addEventListener('click', e => {
  const pill = e.target.closest('.history-stat-pill'); if (!pill) return;
  document.querySelectorAll('.history-stat-pill').forEach(p => p.classList.toggle('active', p === pill));
  statusFilter = pill.dataset.f;
  applyFilter();
});
document.querySelector('.back-btn').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') window.location.href = 'dashboard.html'; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReceipt(); });

window.addEventListener('load', () => {
  const minShow = new Promise(r => setTimeout(r, 700));
  Promise.all([fetchAllTrades(), minShow]);
});

// Poll every 10 seconds to check for new trades and play sound
setInterval(() => {
    if (document.hidden) return;
    fetchAllTrades(true);
}, 10000);

</script>
